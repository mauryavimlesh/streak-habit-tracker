    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />

    <!-- Mobile & PWA Configuration -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Critical Resource Preloads -->
    <link rel="preload" as="image" type="image/png" href="/logo.png" fetchpriority="high" />
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="modulepreload" href="/src/App.tsx" />

    <!-- Non-Render-Blocking Web Fonts with Preload & Swap -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=SF+Pro+Display:wght@500;600;700;800&display=swap" as="style" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=SF+Pro+Display:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=SF+Pro+Display:wght@500;600;700;800&display=swap" />
    </noscript>

    <!-- Critical Startup CSS (Immediate paint, zero-flash background & layout stability) -->
    <style id="critical-startup-css">
      html, body {
        margin: 0;
        padding: 0;
        background-color: #0d0e12;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        min-height: 100dvh;
        background-color: #0d0e12;
      }
      #initial-pre-splash {
        position: fixed;
        inset: 0;
        background: #000000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 99999;
        will-change: opacity, transform;
      }
      @keyframes streak-splash-in {
        0% { opacity: 0; transform: scale(0.92); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes streak-splash-fadeout {
        0% { opacity: 1; }
        100% { opacity: 0; visibility: hidden; }
      }
    </style>

    <!-- Structured Data: SoftwareApplication, Organization, WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "@id": "https://streakloop.vercel.app/#software",
          "name": "STREAK",
          "applicationCategory": "ProductivityApplication",
          "operatingSystem": "Web, iOS, Android",
          "url": "https://streakloop.vercel.app/",
          "description": "Build better habits, track your streaks, manage goals and tasks, journal your progress, and stay focused with STREAK.",
          "offers": {
            "@type": "Offer",
            "price": "0",
            "priceCurrency": "USD"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://streakloop.vercel.app/#organization",
          "name": "STREAK",
          "url": "https://streakloop.vercel.app/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://streakloop.vercel.app/icon-512.png",
            "width": 512,
            "height": 512
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://streakloop.vercel.app/#website",
          "name": "STREAK",
          "url": "https://streakloop.vercel.app/",
          "publisher": {
            "@id": "https://streakloop.vercel.app/#organization"
          }
        },
        {
          "@type": "FAQPage",
          "@id": "https://streakloop.vercel.app/#faq",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is STREAK?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "STREAK is an all-in-one habit and productivity tracker that brings daily habit tracking, goal milestones, task checklists, study focus timers, reflection journaling, and visual consistency heatmaps into one unified workspace."
              }
            },
            {
              "@type": "Question",
              "name": "Is STREAK free to use?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. STREAK is completely free to use. You can start tracking habits immediately in Guest Mode without creating an account or providing a credit card. Your progress is saved locally, with optional cloud backup when you sign in."
              }
            },
            {
              "@type": "Question",
              "name": "Can I track daily habits and maintain consistency streaks?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. STREAK calculates real-time daily completion streaks, longest consistency records, and percentage completion rates. You can customize habit frequencies, target quantities, and daily reminder alerts."
              }
            },
            {
              "@type": "Question",
              "name": "Can I track goals and tasks alongside daily habits?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. STREAK allows you to map overarching life and career goals into actionable milestones, and organize daily to-do tasks alongside your recurring habit routines."
              }
            },
            {
              "@type": "Question",
              "name": "Does STREAK include a study and focus timer?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. STREAK includes an integrated Focus & Study Timer with stopwatch and countdown modes, customizable session durations, and persistent focus history to boost concentration."
              }
            },
            {
              "@type": "Question",
              "name": "Does STREAK work offline?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. STREAK is engineered offline-first. All your habits, streak counts, completed tasks, and journal entries are instantly saved locally in your browser and automatically sync when online."
              }
            },
            {
              "@type": "Question",
              "name": "How does the AI Habit Coach help improve consistency?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "STREAK features an intelligent AI Coach powered by modern Gemini models that evaluates your habit consistency patterns, suggests evidence-based routines, and answers productivity questions."
              }
            },
            {
              "@type": "Question",
              "name": "Does STREAK work on iPhone, Android, and desktop browsers?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. STREAK is responsive and runs seamlessly across iPhone (Safari & PWA), Android (Chrome & PWA), iPad, Mac, and Windows desktop workstations."
              }
            },
            {
              "@type": "Question",
              "name": "Is my habit and journal data private and secure?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Your personal habits, daily logs, and reflection journals remain completely private. Personal data is never indexed by search engines and is stored securely."
              }
            },
            {
              "@type": "Question",
              "name": "Can I export or backup my habit data?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. STREAK supports account-based cloud synchronization with Google or email, ensuring your consistency streaks and journal records are backed up and accessible across all your devices."
              }
            }
          ]
        }
      ]
    }

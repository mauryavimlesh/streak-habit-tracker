<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0d0e12" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#232733" stroke-width="8" />
  
  <!-- Outer glowing streak ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#grad)" stroke-width="36" stroke-linecap="round" stroke-dasharray="620 260" transform="rotate(-45 256 256)" />
  
  <!-- Dynamic inner pulse dot -->
  <circle cx="256" cy="256" r="42" fill="url(#grad)" filter="url(#glow)" />
  <circle cx="256" cy="256" r="32" fill="#ffffff" opacity="0.9" />
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="streak-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84ee18" />
      <stop offset="35%" stop-color="#00f0ff" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Pure black circular core -->
  <circle cx="256" cy="256" r="112" fill="#000000" />
  <!-- Authoritative STREAK Torus Ring -->
  <circle cx="256" cy="256" r="154" fill="none" stroke="url(#streak-grad)" stroke-width="80" stroke-linecap="round" stroke-dasharray="880 180" transform="rotate(-75 256 256)" filter="url(#subtle-glow)" />
</svg>